<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1-Forge</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
    <h1>Login - F1-Forge</h1>
    <nav>
        <div class="nav-right">
        <button class="theme-toggle" id="themeToggle">DARK</button>
        </div>
    </nav>
    <section id="login">
  <div class="centered">
    <span class="sec-num">LOGIN</span>
    <h2>WELCOME BACK</h2>
    
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="loginEmail" class="input" placeholder="your@email.com">
        <span class="form-message" id="emailError"></span>
      </div>
      
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="loginPassword" class="input" placeholder="••••••••">
        <span class="form-message" id="passwordError"></span>
      </div>

      <button type="submit" class="auth-btn">LOGIN →</button>

      <span class="auth-switch">
        No account? <a href="signup.html">Sign Up</a>
      </span>
    </form>
  </div>
</section>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>

</html>
