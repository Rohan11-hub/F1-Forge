<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paddock — F1 Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/paddock.css">
</head>

<body>

  <!-- CURSOR -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="logo">F1 FORGE</a>
    <div class="nav-links">
      <a href="teambuilder.html">Team Builder</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="paddock.html" class="active">Paddock</a>
      <a href="settings.html">Settings</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle">DARK</button>
    </div>
  </nav>

  <!-- HEADER -->
  <div id="paddock-header">
    <div class="centered">
      <span class="sec-num">INFO HUB</span>
      <h2>PADDOCK</h2>
      <p class="paddock-sub">Drivers, constructors and the full 2026 race calendar.</p>
    </div>
  </div>

  <!-- TABS -->
  <div id="tab-bar">
    <div class="centered tab-inner">
      <button class="tab-btn active" data-tab="drivers">DRIVERS</button>
      <button class="tab-btn" data-tab="constructors">CONSTRUCTORS</button>
      <button class="tab-btn" data-tab="races">RACES</button>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="centered">

      <!-- DRIVERS TAB -->
      <section id="tab-drivers" class="tab-content active">
        <div class="card-grid" id="driverGrid"></div>
      </section>

      <!-- CONSTRUCTORS TAB -->
      <section id="tab-constructors" class="tab-content">
        <div class="card-grid" id="constructorGrid"></div>
      </section>

      <!-- RACES TAB -->
      <section id="tab-races" class="tab-content">
        <div class="race-list" id="raceList"></div>
      </section>

    </div>
  </main>

  <!-- MODAL -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/paddock.js"></script>

</body>
</html>
