<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — F1 Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

  <!-- CURSOR -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="logo">F1 FORGE</a>
    <button class="theme-toggle" id="themeToggle">DARK</button>
  </nav>

  <!-- SIGNUP -->
  <section id="auth">
    <div class="centered">
      <span class="sec-num">JOIN THE GRID</span>
      <h2>CREATE ACCOUNT</h2>
      <p class="auth-sub">Build your team and compete globally.</p>

      <form class="auth-form" id="signupForm">

        <div class="form-group">
          <label class="form-label">USERNAME</label>
          <input type="text" id="signupUsername" class="input" placeholder="RacerX" autocomplete="username">
          <span class="form-message" id="usernameMsg"></span>
        </div>

        <div class="form-group">
          <label class="form-label">EMAIL</label>
          <input type="email" id="signupEmail" class="input" placeholder="your@email.com" autocomplete="email">
          <span class="form-message" id="emailMsg"></span>
        </div>

        <div class="form-group">
          <label class="form-label">PASSWORD</label>
          <input type="password" id="signupPassword" class="input" placeholder="••••••••" autocomplete="new-password">
          <span class="form-message" id="passwordMsg"></span>
        </div>

        <div class="form-group">
          <label class="form-label">CONFIRM PASSWORD</label>
          <input type="password" id="signupConfirm" class="input" placeholder="••••••••" autocomplete="new-password">
          <span class="form-message" id="confirmMsg"></span>
        </div>

        <button type="submit" class="auth-btn" id="signupBtn">CREATE ACCOUNT →</button>

        <span class="auth-switch">
          Already have an account? <a href="login.html">Login</a>
        </span>

      </form>
    </div>
  </section>

  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
